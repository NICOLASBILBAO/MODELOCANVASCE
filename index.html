<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modelo CANVAS de la idea de negocio</title>
<style>
:root{--bg:#f4f7fc;--fg:#0f1f3d;--card:#fff;--line:#cfd9ec;--blue:#0b3d91;--green:#1a8f4c;--gold:#f5b700;--mut:#44546f;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1428;--fg:#eef3ff;--card:#13223f;--line:#2b3f66;--blue:#7fb0ff;--green:#4fd18a;--gold:#ffd24a;--mut:#b4c2de;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0a1428;--fg:#eef3ff;--card:#13223f;--line:#2b3f66;--blue:#7fb0ff;--green:#4fd18a;--gold:#ffd24a;--mut:#b4c2de;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:8px 16px;background:#0b3d91;color:#fff;font-size:.85rem;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}header b{color:#ffd24a}
header button{padding:4px 10px;margin:0 0 0 4px;background:transparent;border:2px solid #fff;color:#fff}header button[aria-pressed=true]{background:#ffd24a;color:#0f1f3d;border-color:#ffd24a}
#prog{height:8px;background:var(--line)}#prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));width:0;transition:width .4s}
main{max-width:980px;margin:0 auto;padding:18px 16px 60px}h1,h2{line-height:1.2}h1{font-size:clamp(1.5rem,5vw,2.4rem);margin:.3em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.cover{text-align:center}
.tag{display:inline-block;background:var(--gold);color:#0f1f3d;font-weight:700;border-radius:99px;padding:4px 14px;margin:4px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--blue);color:#fff;margin:4px 4px 4px 0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#0a1428}}
button.sec{background:transparent;color:var(--fg);border:2px solid var(--line)}button.gr{background:var(--green);color:#fff}button.go{background:var(--gold);color:#0f1f3d}
button.ok{background:var(--green);color:#fff}button.no{background:var(--bad);color:#fff}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--fg)}
label{display:block;font-weight:600;margin:10px 0 4px}.err{color:var(--bad);font-size:.9rem;min-height:1.2em}.small{font-size:.85rem;color:var(--mut)}
.ej{border-left:5px solid var(--gold);background:rgba(245,183,0,.14);padding:8px 14px;border-radius:8px;margin:8px 0}
.pista{border-left:5px solid var(--blue);background:rgba(11,61,145,.1);padding:8px 14px;border-radius:8px;margin:8px 0}
.fb{border-left:5px solid var(--green);padding:8px 14px;background:rgba(26,143,76,.1);border-radius:8px;margin:8px 0}
.q{display:block;width:100%;text-align:left;background:transparent;color:var(--fg);border:2px solid var(--line)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(10,1fr)}.grid>div{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px}
.grid h4{margin:0 0 4px;color:var(--blue);font-size:.85rem}.grid textarea{min-height:110px;font-size:.85rem}
.g1{grid-column:1/3;grid-row:1/3}.g2{grid-column:3/5}.g3{grid-column:5/7;grid-row:1/3}.g4{grid-column:7/9}.g5{grid-column:9/11;grid-row:1/3}.g6{grid-column:3/5}.g8{grid-column:7/9}.g9{grid-column:1/6}.g10{grid-column:6/11}
@media(max-width:760px){.grid{grid-template-columns:1fr}.grid>div{grid-column:auto!important;grid-row:auto!important}}
.cube{width:90px;height:90px;margin:18px auto 30px;perspective:500px;touch-action:none;cursor:grab}
.cube div{position:relative;width:90px;height:90px;transform-style:preserve-3d;animation:giro 9s linear infinite}
.cube span{position:absolute;width:90px;height:90px;display:grid;place-items:center;font-size:2.4rem;border:3px solid var(--gold);background:#0b3d91;border-radius:12px}
.cube span:nth-child(1){transform:translateZ(45px)}.cube span:nth-child(2){transform:rotateY(90deg) translateZ(45px)}.cube span:nth-child(3){transform:rotateY(180deg) translateZ(45px)}.cube span:nth-child(4){transform:rotateY(-90deg) translateZ(45px)}
@keyframes giro{to{transform:rotateY(360deg) rotateX(15deg)}}
@media(prefers-reduced-motion:reduce){.cube div{animation:none}#prog i{transition:none}}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:.85rem}.bar b{flex:0 0 150px}.bar i{display:block;height:14px;border-radius:7px;background:var(--green)}
.big{font-size:3rem;font-weight:800;color:var(--blue)}
@media print{header,#prog,button,.noprint{display:none!important}body{background:#fff;color:#000}.card{break-inside:avoid}}
</style>
</head>

var DOC="NICOLAS BILBAO";
var B=[{"i":"👥","n":["Segmentos de clientes","Customer segments"],"h":["Piensa en características, comportamientos y necesidades. ¿Es mercado de masas, segmento específico, muy segmentado, diversificado o multilateral?","Think about characteristics, behaviors and needs. Is it a mass market, a specific segment, highly segmented, diversified or multi-sided?"],"e":["Netflix: mercado masivo, fanáticos de películas y series, personas que sustituyen el cable por satélite.","Netflix: mass market, movie and series fans, people replacing satellite cable."],"k":["cliente","edad","años","necesidad","segmento","mercado","persona","empresa","customer","age","need","market","people"],"q":[["¿Para quién estamos creando valor? ¿Quiénes son nuestros clientes más importantes y por qué compran?","Who are we creating value for? Who are our most important customers and why do they buy?"],["Describe las características, comportamientos y necesidades de tu cliente ideal.","Describe the characteristics, behaviors and needs of your ideal customer."],["¿Qué variables usarías para segmentar tu mercado y cuál segmento es más relevante? Explica por qué.","Which variables would you use to segment your market and which segment is most relevant? Explain why."],["Aplica a tu idea: ¿cuál es tu segmento principal y qué evidencia tienes de que existe esa necesidad?","Apply to your idea: who is your main segment and what evidence shows the need exists?"],["¿Qué segmentos secundarios podrían interesarte y por qué priorizas el principal?","Which secondary segments could interest you and why do you prioritize the main one?"]],"M":[{"t":["¿Cuál describe mejor un segmento de clientes?","Which best describes a customer segment?"],"o":[["Grupo de personas u organizaciones con necesidades similares","A group of people or organizations with similar needs"],["Los proveedores de la empresa","The company’s suppliers"],["El precio del producto","The product price"]]},{"t":["¿Qué tipo de mercado enfoca un solo grupo específico?","Which market type targets one specific group?"],"o":[["Segmento específico (nicho)","Specific segment (niche)"],["Mercado de masas","Mass market"],["Ninguno de los anteriores","None of the above"]]},{"t":["¿Cuál es una variable de segmentación?","Which is a segmentation variable?"],"o":[["Edad, ubicación o comportamiento de compra","Age, location or buying behavior"],["El color del logo","The logo color"],["El número de empleados propios","The number of own employees"]]}],"V":[["Un segmento de clientes puede ser una organización, no solo personas.","A customer segment can be an organization, not just people.",1],["Con un solo perfil de cliente basta; no hace falta investigar el mercado.","One customer profile is enough; no market research is needed.",0,"Falso: la investigación de mercado permite conocer mejor al segmento.","False: market research helps you know the segment better."],["Dirigir esfuerzos a todos los clientes por igual siempre es lo más eficiente.","Targeting all customers equally is always the most efficient.",0,"Falso: conviene enfocar esfuerzos en los segmentos relevantes.","False: it is better to focus efforts on relevant segments."],["Evaluar el tamaño y potencial de un segmento ayuda a elegir a quién servir.","Assessing a segment’s size and potential helps choose whom to serve.",1]]},{"i":"🎁","n":["Propuesta de valor","Value proposition"],"h":["Destaca beneficios únicos, enfócate en beneficios y no en características, y sé auténtico.","Highlight unique benefits, focus on benefits rather than features, and be authentic."],"e":["Netflix: consumo en streaming de un gran catálogo, de forma legal, con un mes gratis y compatibilidad con todo tipo de dispositivos.","Netflix: streaming of a large catalog, legally, with a free month and wide device compatibility."],"k":["problema","valor","beneficio","diferen","competencia","innov","precio","calidad","problem","value","benefit","competitor","unique"],"q":[["¿Qué problema resolvemos, qué necesidad satisfacemos y qué nos diferencia de la competencia?","What problem do we solve, what need do we satisfy and what sets us apart from competitors?"],["¿Qué beneficios únicos recibe tu cliente que no obtiene de la competencia?","Which unique benefits does your customer get that competitors do not offer?"],["Redacta tu propuesta de valor en una frase clara, centrada en beneficios y no en características.","Write your value proposition in one clear sentence, focused on benefits rather than features."],["Aplica a tu idea: ¿qué problema concreto resuelves a tu segmento principal y cómo lo resolvía antes?","Apply to your idea: which concrete problem do you solve for your main segment and how did they cope before?"],["¿Es tu propuesta de valor coherente con las necesidades del segmento? Justifica con un ejemplo.","Is your value proposition consistent with the segment’s needs? Justify with an example."]],"M":[{"t":["¿Qué debe destacar una propuesta de valor?","What should a value proposition highlight?"],"o":[["Beneficios únicos para el cliente","Unique benefits for the customer"],["Solo características técnicas","Only technical features"],["El tamaño de la empresa","The company size"]]},{"t":["¿Qué diferencia a una propuesta de valor de una lista de características?","What distinguishes a value proposition from a feature list?"],"o":[["Se centra en el beneficio que percibe el cliente","It focuses on the benefit the customer perceives"],["Enumera especificaciones técnicas","It lists technical specifications"],["Describe solo el precio","It only describes the price"]]},{"t":["¿Qué puede diferenciarte de la competencia?","What can set you apart from competitors?"],"o":[["Innovación, precios bajos o diseño exclusivo","Innovation, low prices or exclusive design"],["Copiar exactamente a otra empresa","Copying another company exactly"],["Ocultar tus beneficios","Hiding your benefits"]]}],"V":[["La propuesta de valor y el segmento de clientes son el eje central de cualquier modelo de negocio.","The value proposition and customer segment are the core of any business model.",1],["El valor está solo en el producto y no en la experiencia del usuario.","Value lies only in the product, not in the user experience.",0,"Falso: el valor está en todo lo que el usuario puede experimentar.","False: value lies in everything the user can experience."],["Es recomendable ocultar la comparación con la competencia.","It is advisable to hide any comparison with competitors.",0,"Falso: comparar con la competencia ayuda a mostrar tu diferencia.","False: comparing with competitors helps show your difference."],["Ser auténtico y comunicar con emoción hace parte de una buena propuesta de valor.","Being authentic and communicating with emotion is part of a good value proposition.",1]]},{"i":"🚚","n":["Canales","Channels"],"h":["Directos (venta directa, tienda propia, web) o indirectos (minoristas, mayoristas, distribuidores, marketplaces).","Direct (direct sales, own store, web) or indirect (retailers, wholesalers, distributors, marketplaces)."],"e":["Netflix: sitio web, aplicación y decodificadores.","Netflix: website, app and set-top boxes."],"k":["tienda","web","venta","distribuidor","mayorista","minorista","línea","domicilio","store","online","sales","distributor","delivery"],"q":[["¿Con qué canales llegamos a nuestros clientes para entregarles la propuesta de valor?","Through which channels do we reach our customers to deliver the value proposition?"],["¿Qué canales directos e indirectos usarías para vender tu producto o servicio?","Which direct and indirect channels would you use to sell your product or service?"],["¿Por qué esos canales son efectivos para el segmento que elegiste?","Why are those channels effective for the segment you chose?"],["Aplica a tu idea: ¿cuál canal será el más rentable y cuál el más difícil de operar? Explica.","Apply to your idea: which channel will be the most profitable and which the hardest to run? Explain."],["¿Cómo se integran tus canales con las rutinas diarias de tus clientes?","How do your channels fit into your customers’ daily routines?"]],"M":[{"t":["¿Cuál es un canal indirecto?","Which is an indirect channel?"],"o":[["Un distribuidor o mayorista","A distributor or wholesaler"],["La venta directa","Direct sales"],["La tienda propia","Own store"]]},{"t":["¿Cuál es un canal directo?","Which is a direct channel?"],"o":[["Tienda en línea propia","Own online store"],["Mayorista","Wholesaler"],["Agente de ventas de terceros","Third-party sales agent"]]},{"t":["¿Qué describe el canal de distribución?","What does the distribution channel describe?"],"o":[["Cómo el negocio alcanza al segmento para entregar su propuesta de valor","How the business reaches the segment to deliver its value proposition"],["Cuánto cuesta producir","How much it costs to produce"],["Quién es el competidor","Who the competitor is"]]}],"V":[["Los canales no dependen del segmento de clientes elegido.","Channels do not depend on the chosen customer segment.",0,"Falso: los canales dependen del segmento definido.","False: channels depend on the defined segment."],["Una tienda en línea y un marketplace pueden ser canales de venta.","An online store and a marketplace can be sales channels.",1],["Los canales deben ser efectivos para llegar al segmento elegido.","Channels must be effective at reaching the chosen segment.",1],["Los mayoristas son canales de venta directa al cliente final.","Wholesalers are direct-to-final-customer sales channels.",0,"Falso: mayoristas y minoristas son canales indirectos.","False: wholesalers and retailers are indirect channels."]]},{"i":"❤️","n":["Relación con los clientes","Customer relationships"],"h":["Piensa en comunicaciones, posventa, atención personalizada, canal de atención, encuestas y automatización.","Think of communications, after-sales, personalized service, support channel, surveys and automation."],"e":["Netflix: servicio propio y servicio automatizado.","Netflix: self-service and automated service."],"k":["atención","posventa","comunicación","encuesta","feedback","soporte","fideliz","reclamo","service","support","survey","loyalty","after"],"q":[["¿Qué tipo de relación esperan los clientes y cómo los alcanzamos, mantenemos y posicionamos?","What relationship do customers expect and how do we reach, keep and position them?"],["¿Cómo atraerás y mantendrás a tus clientes? Describe tu atención personalizada o automatizada.","How will you attract and keep customers? Describe your personalized or automated service."],["¿Cómo manejarás reclamos y obtendrás retroalimentación de tus clientes?","How will you handle complaints and collect feedback from customers?"],["Aplica a tu idea: ¿qué relación esperan tus clientes y cuánto costaría mantenerla?","Apply to your idea: what relationship do your customers expect and how much would it cost to keep it?"],["¿Cómo medirás si tus clientes están satisfechos y vuelven a comprar?","How will you measure whether customers are satisfied and buy again?"]],"M":[{"t":["¿Cuál es una acción de relación con el cliente?","Which is a customer relationship action?"],"o":[["Aplicar encuestas y pedir retroalimentación","Run surveys and ask for feedback"],["Comprar maquinaria","Buy machinery"],["Definir el arriendo","Set the rent"]]},{"t":["¿Cuál es una herramienta de retroalimentación?","Which is a feedback tool?"],"o":[["Encuestas a clientes","Customer surveys"],["Contratos con proveedores","Supplier contracts"],["Inventario de materias primas","Raw material inventory"]]},{"t":["¿Qué incluye la relación con el cliente?","What does the customer relationship include?"],"o":[["Comunicaciones, posventa y atención personalizada","Communications, after-sales and personalized service"],["Solo el precio","Only the price"],["Solo la producción","Only production"]]}],"V":[["La atención posventa hace parte de la relación con el cliente.","After-sales service is part of the customer relationship.",1],["Las reclamaciones deben ignorarse para no afectar la relación.","Complaints should be ignored so as not to affect the relationship.",0,"Falso: manejar bien problemas y reclamaciones fortalece la relación.","False: handling problems and complaints well strengthens the relationship."],["La relación con el cliente no requiere capacitar al equipo.","Customer relationships do not require training the team.",0,"Falso: la capacitación del equipo mejora la atención.","False: team training improves service."],["La automatización puede ser una forma de relacionarse con el cliente.","Automation can be a way to relate to the customer.",1]]},{"i":"💰","n":["Fuentes de ingresos","Revenue streams"],"h":["Venta, suscripción, publicidad, licencias, comisiones, alquiler, consultoría o franquicias.","Sales, subscription, advertising, licenses, commissions, rental, consulting or franchises."],"e":["Netflix: ganancias por suscripción mensual.","Netflix: monthly subscription revenue."],"k":["precio","venta","suscrip","comisión","licencia","mensual","pago","ingreso","price","sale","subscription","fee","monthly","revenue","$"],"q":[["¿Por qué valor pagan los clientes, cómo y con qué frecuencia (diario, mensual, fijo, variable, estacional)?","What value do customers pay for, how, and how often (daily, monthly, fixed, variable, seasonal)?"],["¿Qué fuentes de ingreso tendrá tu negocio (venta, suscripción, comisiones, etc.)?","Which revenue sources will your business have (sales, subscription, commissions, etc.)?"],["¿Tu flujo de ingresos será diario, mensual, fijo, variable o estacional? Justifica.","Will your income flow be daily, monthly, fixed, variable or seasonal? Justify."],["Aplica a tu idea: ¿cuánto estarían dispuestos a pagar tus clientes y por qué?","Apply to your idea: how much would your customers be willing to pay and why?"],["¿Qué fuente de ingresos aportaría más al total y cómo la validarías?","Which revenue source would contribute most to the total and how would you validate it?"]],"M":[{"t":["¿Cuál es una fuente de ingresos?","Which is a revenue stream?"],"o":[["Modelo de suscripción","Subscription model"],["Costos de personal","Staff costs"],["Recursos humanos","Human resources"]]},{"t":["¿Cuál es una fuente de ingresos distinta a la venta directa?","Which is a revenue source other than direct sales?"],"o":[["Comisiones","Commissions"],["Costos de personal","Staff costs"],["Costos de logística","Logistics costs"]]},{"t":["¿Para qué sirve conocer el flujo de ingresos?","Why know the revenue flow?"],"o":[["Para la rentabilidad y sostenibilidad de la propuesta de valor","For the profitability and sustainability of the value proposition"],["Para elegir el logo","To choose the logo"],["Para contratar proveedores","To hire suppliers"]]}],"V":[["La información de ingresos es clave para la rentabilidad y sostenibilidad de la propuesta de valor.","Revenue information is key to the profitability and sustainability of the value proposition.",1],["El ingreso de un negocio siempre es fijo y nunca estacional.","A business’s income is always fixed and never seasonal.",0,"Falso: el flujo puede ser fijo, variable o estacional.","False: income can be fixed, variable or seasonal."],["La publicidad y las licencias no pueden ser fuentes de ingresos.","Advertising and licenses cannot be revenue sources.",0,"Falso: ambas son fuentes de ingresos posibles.","False: both are possible revenue sources."],["Una suscripción es una fuente de ingresos recurrente.","A subscription is a recurring revenue source.",1]]},{"i":"🏭","n":["Recursos clave","Key resources"],"h":["Incluye local, maquinaria, tecnología, know-how y equipo humano. Si aplica, equipos de protección y seguridad.","Include premises, machinery, technology, know-how and people. If applicable, protective and safety equipment."],"e":["Netflix: contenido virtual y servidores.","Netflix: virtual content and servers."],"k":["local","maquinaria","tecnolog","personal","humano","capital","financiero","know-how","equipo","machinery","sta  var h='<h2>'+T(["Ejercicios aplicados a tu idea","Exercises for your idea"])+'</h2><p class="small">'+T(["Práctica formativa, sin puntaje. Se incluye en el PDF y en la página HTML.","Formative practice, without score. Included in the PDF and the HTML page."])+'</p><div class="card"><b>1. '+T(["Punto de equilibrio simple","Simple break-even"])+'</b><p>'+T(["Fórmula: PE = costos fijos ÷ (precio − costo variable unitario). Usa cifras estimadas de tu idea.","Formula: BE = fixed costs ÷ (price − unit variable cost). Use estimated figures for your idea."])+'</p><label for="cf">'+T(["Costos fijos mensuales","Monthly fixed costs"])+'</label><input id="cf" type="number" min="0" data-ex="cf" value="'+esc(x.cf||"")+'"><label for="pp">'+T(["Precio por unidad","Price per unit"])+'</label><input id="pp" type="number" min="0" data-ex="p" value="'+esc(x.p||"")+'"><label for="cv">'+T(["Costo variable por unidad","Variable cost per unit"])+'</label><input id="cv" type="number" min="0" data-ex="cv" value="'+esc(x.cv||"")+'"><div class="fb" id="pe2" aria-live="polite">'+esc(peq())+'</div></div>'+
 '<div class="card"><b>2. '+T(["Utilidad mensual estimada","Estimated monthly profit"])+'</b><p>'+T(["Con los datos del ejercicio 1, estima cuántas unidades venderías al mes. Utilidad = unidades × (precio − costo variable) − costos fijos.","Using exercise 1 data, estimate how many units you would sell per month. Profit = units × (price − variable cost) − fixed costs."])+'</p><label for="uu">'+T(["Unidades esperadas al mes","Expected units per month"])+'</label><input id="uu" type="number" min="0" data-ex="u" value="'+esc(x.u||"")+'"><div class="fb" id="ut2" aria-live="polite">'+esc(utl())+'</div></div>';
 TX.forEach(function(q,k){h+='<div class="card"><b>'+(k+3)+'. '+esc(T(q[1]))+'</b><p>'+esc(T(q[2]))+'</p><textarea data-ex="'+q[0]+'" rows="4" aria-label="'+esc(T(q[1]))+'">'+esc(x[q[0]]||"")+'</textarea></div>'});
 return h+'<button data-act="sig">'+T(["Ver lienzo completo","See full canvas"])+'</button>'}
function vLienzo(){var ord=[7,6,1,3,0,5,2,8,4],cl=["g1","g2","g3","g4","g5","g6","g8","g9","g10"];
 return'<h2>'+T(["Tu lienzo CANVAS","Your CANVAS"])+'</h2><p class="small">'+T(["Puedes editar cualquier bloque.","You can edit any block."])+'</p><div class="grid">'+ord.map(function(b,k){return'<div class="'+cl[k]+'"><h4>'+esc(T(B[b].n))+'</h4><textarea data-b="'+b+'" aria-label="'+esc(T(B[b].n))+'">'+esc(estado.resp[b]||"")+'</textarea></div>'}).join("")+'</div><button data-act="sig">'+T(["Ver resultados","See results"])+'</button>'}
function vDash(){var p=punt(),mn=Math.max(1,Math.round((Date.now()-estado.t0)/60000)),ix=p.p.map(function(v,i){return i}).sort(function(a,b){return p.p[b]-p.p[a]});
 var nm=function(l){return l.map(function(i){return esc(T(B[i].n))}).join(", ")};
 return'<h2>'+T(["Resultados","Results"])+'</h2><div class="card"><p><b>'+T(["Estudiante(s)","Student(s)"])+':</b> '+esc(nombres())+'<br><b>'+T(["Idea","Idea"])+':</b> '+esc(estado.idea.n)+' — '+esc(estado.idea.d)+'<br><b>'+T(["Docente","Teacher"])+':</b> '+DOC+'</p><div class="big">'+p.t+'/100</div><p><b>'+T(["Nivel","Level"])+':</b> '+p.n+' · '+mn+' min</p>'+
 B.map(function(b,i){return'<div class="bar"><b>'+esc(T(b.n))+'</b><i style="width:'+p.p[i]*2+'px;max-width:50%"></i><span>'+p.p[i]+'</span></div>'}).join("")+'<p><b>'+T(["Fortalezas","Strengths"])+':</b> '+nm(ix.slice(0,3))+'</p><p><b>'+T(["A mejorar","To improve"])+':</b> '+nm(ix.slice(-3))+'</p><p class="small">'+T(["Retroalimentación orientativa generada por el simulador; la calificación oficial corresponde al docente.","Guidance feedback generated by the simulator; the official grade belongs to the teacher."])+'</p></div><div class="noprint"><button class="gr" data-act="pdf">'+T(["Descargar PDF","Download PDF"])+'</button><button class="go" data-act="html">'+T(["Descargar página HTML","Download HTML page"])+'</button><button class="sec" data-act="print">'+T(["Imprimir","Print"])+'</button><button class="sec" data-act="rev">'+T(["Revisar respuestas","Review answers"])+'</button><button class="sec" data-act="reset">'+T(["Reiniciar","Restart"])+'</button></div><div class="err" id="pe" role="alert"></div>'}
/* ===== INFORME (PDF y HTML) ===== */
function fname(){var s=(estado.idea.n||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_+|_+$/g,"");return"modelo_canvas_"+(s||"idea")}
function lineas(){var p=punt(),r=[];
 r.push(["h","UNIVERSIDAD AMERICANA — MODELO CANVAS DE LA IDEA DE NEGOCIO"],["t","CREACIÓN DE EMPRESAS · INGENIERÍA EN SEGURIDAD Y SALUD EN EL TRABAJO"],["t",T(["DOCENTE","TEACHER"])+": "+DOC],["t",T(["Integrantes","Members"])+": "+nombres()],["t",T(["Idea","Idea"])+": "+estado.idea.n+" — "+estado.idea.d],["t",new Date().toLocaleString(estado.l?"en-US":"es-CO")]);
 B.forEach(function(b,i){var s=sc(i),mc=estado.mc[i]||[],vf=estado.vf[i]||[],ok=mc.filter(function(v){return v===0}).length,vo=vf.filter(function(v,k){return v===b.V[k][2]}).length,j;
  r.push(["h",(i+1)+". "+T(b.n)+" ("+s.tot+"/100)"]);
  for(j=0;j<b.q.length;j++)r.push(["t",(j+1)+") "+T(b.q[j])+" "+(ab(i,j)||T(["(sin respuesta)","(no answer)"]))]);
  r.push(["t",T(["Cerradas correctas","Multiple choice correct"])+": "+ok+"/3 · V/F: "+vo+"/4"])});
 r.push(["h",T(["Ejercicios","Exercises"])],["t",ejTxt()],["h",T(["Puntaje total","Total score"])+": "+p.t+"/100 — "+p.n],["t",T(["Retroalimentación orientativa generada por el simulador; la calificación oficial corresponde al docente.","Guidance feedback generated by the simulator; the official grade belongs to the teacher."])]);return r}
function crearPDF(){if(!window.jspdf){var e=document.getElementById("pe");if(e)e.textContent=T(["jsPDF no cargó; usa Imprimir.","jsPDF did not load; use Print."]);window.print();return}
 var d=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),y=20;
 lineas().forEach(function(l){var h=l[0]==="h";d.setFont("helvetica",h?"bold":"normal");d.setFontSize(h?12:10);if(h)y+=3;d.splitTextToSize(l[1].replace(/[✔✘]/g,function(c){return c==="✔"?"OK":"X"}),170).forEach(function(s){if(y>282){d.addPage();y=20}d.text(s,20,y);y+=5})});d.save(fname()+".pdf")}
function crearHTML(){var h='<!DOCTYPE html><html lang="'+(estado.l?"en":"es")+'"><head><meta charset="utf-8"><title>Modelo CANVAS</title><style>body{font-family:system-ui,sans-serif;max-width:800px;margin:auto;padding:20px;line-height:1.5}h2{color:#0b3d91;border-bottom:3px solid #f5b700}</style></head><body>'+lineas().map(function(l){return l[0]==="h"?"<h2>"+esc(l[1])+"</h2>":"<p>"+esc(l[1])+"</p>"}).join("")+"</body></html>";
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([h],{type:"text/html"}));a.download=fname()+".html";document.body.appendChild(a);a.click();a.remove()}

function render(keep){if(!keep&&VOZ)speechSynthesis.cancel();
 app.innerHTML=(estado.p>0?'<button class="sec" data-act="atras">← '+T(["Atrás","Back"])+'</button>':"")+[vPortada,vReg,vIns,vCtx,vPaso,vEj,vLienzo,vDash][estado.p]()+'<div class="small" id="av"></div>';
 document.documentElement.lang=estado.l?"en":"es";document.querySelectorAll("[data-act^=l]").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.act==="l"+estado.l)});
 document.getElementById("hd").innerHTML="<b>UNIVERSIDAD AMERICANA</b> · "+T(["Docente","Teacher"])+": "+DOC+(estado.p>1?" · "+T(["Estudiante(s)","Student(s)"])+": "+esc(nombres())+" | "+T(["Idea","Idea"])+": "+esc(estado.idea.n):"");
 var pc=Math.round((estado.p+(estado.p===4?estado.paso/9:0))/7*100),pr=document.getElementById("prog");pr.setAttribute("aria-valuenow",pc);pr.firstElementChild.style.width=pc+"%";
 if(!keep)window.scrollTo(0,0);guardar()}
function sig(){if(estado.p===4&&estado.paso<8)estado.paso++;else estado.p++;render()}
function validar(){var ok=true,m=T(["Campo obligatorio.","Required field."]);
 estado.equipo.forEach(function(n,i){var e=document.getElementById("e"+i);e.textContent=n.trim()?"":m;if(!n.trim())ok=false});
 [["in",estado.idea.n],["id",estado.idea.d]].forEach(function(x){var e=document.getElementById("e"+x[0]);e.textContent=x[1].trim()?"":m;if(!x[1].trim())ok=false});return ok}
app.addEventListener("input",function(e){var t=e.target;
 if(t.dataset.i!==undefined)estado.equipo[+t.dataset.i]=t.value;else if(t.id==="in")estado.idea.n=t.value;else if(t.id==="id")estado.idea.d=t.value;
 else if(t.dataset.o!==undefined){var j=+t.dataset.o;if(j===0)estado.resp[estado.paso]=t.value;else estado.oa[estado.paso+"_"+j]=t.value;document.getElementById("cnt"+j).textContent=t.value.length+" / 1200";document.getElementById("fb"+j).innerHTML=msg(estado.paso,j)}
 else if(t.dataset.b!==undefined)estado.resp[+t.dataset.b]=t.value;else if(t.dataset.ex){estado.ex=estado.ex||{};estado.ex[t.dataset.ex]=t.value;if(["cf","p","cv","u"].indexOf(t.dataset.ex)>=0){document.getElementById("pe2").textContent=peq();document.getElementById("ut2").textContent=utl()}}guardar()});
app.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.dataset.i!==undefined){e.preventDefault();saludar()}});
app.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 if(b.dataset.mc!==undefined){var pi=estado.paso,pk=+b.dataset.k;estado.mc[pi]=estado.mc[pi]||[];if(estado.mc[pi][pk]===undefined){estado.mc[pi][pk]=+b.dataset.mc;render(1)}return}
 if(b.dataset.vf!==undefined){var vi=estado.paso,vk=+b.dataset.k;estado.vf[vi]=estado.vf[vi]||[];if(estado.vf[vi][vk]===undefined){estado.vf[vi][vk]=+b.dataset.vf;render(1)}return}
 var a=b.dataset.act;
 if(a==="add"){estado.equipo.push("");render()}
 else if(a==="saludo")saludar();
 else if(a==="reg"){if(validar()){decir(bien());estado.p++;render(1);window.scrollTo(0,0)}}else if(a==="sig")sig();
 else if(a==="atras"){if(estado.p===4&&estado.paso>0)estado.paso--;else{estado.p--;if(estado.p===4)estado.paso=8}render()}
 else if(a==="retomar"){var o=cargar();if(o){estado=o;render()}}
 else if(a==="voz"){var i=estado.paso,id=b.dataset.id;decir(id==="ins"?T(["Construye los nueve bloques del Modelo Canvas de tu idea de negocio. Cada bloque tiene pista, ejemplo, pregunta abierta, cerrada y de verdadero o falso.","Build the nine blocks of the Canvas Model for your business idea. Each block has a hint, an example, an open question, a multiple-choice and a true or false."]):id==="ctx"?T(["El Modelo Canvas fue desarrollado por Alexander Osterwalder y Yves Pigneur y tiene nueve módulos.","The Canvas Model was developed by Alexander Osterwalder and Yves Pigneur and has nine modules."]):T(B[i].n)+". "+B[i].q.map(function(x){return T(x)}).join(" ")+" "+T(B[i].h))}
 else if(a==="pausa"){speechSynthesis.paused?speechSynthesis.resume():speechSynthesis.pause()}else if(a==="stop")speechSynthesis.cancel();
 else if(a==="pdf")crearPDF();else if(a==="html")crearHTML();else if(a==="print")window.print();
 else if(a==="rev"){estado.p=4;estado.paso=0;render()}
 else if(a==="reset"){if(confirm(T(["¿Reiniciar? Se perderán tus respuestas.","Restart? Your answers will be lost."]))){try{localStorage.removeItem("canvas_estado")}catch(x){}estado=JSON.parse(JSON.stringify(E0));estado.t0=Date.now();render()}}});
document.querySelector("header").addEventListener("click",function(e){var b=e.target.closest("[data-act^=l]");if(b){estado.l=+b.dataset.act[1];render(1)}});

render();
